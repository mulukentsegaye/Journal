# Optimized JVM memory settings for 12-core, 16GB RAM system:
# 3GB heap + 512MB metaspace prevents Windows pagefile swapping/disk thrashing
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3

# Enable parallel compilation across subprojects (utilizing all CPU cores)
org.gradle.parallel=true

# Enable local build caching to reuse task outputs across builds
org.gradle.caching=true

# Keep Gradle daemon warm in memory between builds
org.gradle.daemon=true

# Enable file-system watching to avoid scanning files on disk
org.gradle.vfs.watch=true

# Enable Kotlin incremental compilation and build cache
kotlin.incremental=true
kotlin.caching.enabled=true
kapt.incremental.apt=true
kapt.use.worker.api=true

# Android Gradle Plugin build optimizations
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
android.enableR8.fullMode=false

# Bypass Flutter build dependency deprecation validation warnings
skipDependencyChecks=true
